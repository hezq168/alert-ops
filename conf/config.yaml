app:
  name: "alert_app"
  mode: "dev"
  port: 8080
  version: "v0.0.1"
  start_time: "2026-01-01"
  machine_id: 1


log:
  level: "debug"
  filename: "logs/alert_app.log"
  max_size: 200
  max_age: 30
  max_backups: 7

mysql:
  host: "127.0.0.1"
  port: 3306
  username: "root"
  password: "123456"
  dbname: "alert_app"
  max_idle_conns: 10
  max_open_conns: 100
  max_lifetime: "1h"

jwt:
  secret: "1234567890abvdefghijkopqkda"
  expire: 24

alert:
  ai:
    provider: "openai"       # openai（兼容 OpenAI API 的提供商，如阿里百炼）/ codebuddy
    api_key: ""              # AI API Key
    base_url: ""  # 阿里百炼兼容 OpenAI 的地址
    model: "" # 模型名称
  work_time:
    start: "09:00"
    end: "18:00"